<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>謎解きフォーム</title>
    
    <!-- Google Fonts Klee One -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* すべての要素にbox-sizingを適用し、はみ出しを防止 */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --primary-color: #5a80b4;
            --primary-hover: #456897;
            --bg-color: #f0f4f8;
            --text-color: #334155;
            --error-color: #d97706;
            --success-color: #16a34a;
            --warning-color: #ea580c;
            --info-color: #2563eb;
            --danger-color: #dc2626;
        }

        body {
            font-family: 'Klee One', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .puzzle-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        /* 画像：画面幅に応じて縮小 */
        .puzzle-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-bottom: 24px;
            object-fit: contain;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: block;
        }

        /* 検索風フォーム（スマホ対応レイアウト） */
        .search-form {
            display: flex;
            flex-wrap: nowrap; /* ボタンが改行されないようにする */
            width: 100%;
            border: 2px solid #cbd5e1;
            border-radius: 30px;
            overflow: hidden; /* ボタンの角丸を親に合わせる */
            background-color: #fff;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 20px;
        }

        .search-form:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(90, 128, 180, 0.15);
        }

        .search-input {
            flex: 1; /* 残りの幅をすべて埋める */
            min-width: 0; /* これがないとflexアイテムが親を突き破る原因になる */
            border: none;
            padding: 16px 20px;
            font-size: 18px;
            font-family: 'Klee One', sans-serif;
            outline: none;
            background: transparent;
            color: var(--text-color);
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .submit-btn {
            flex-shrink: 0; /* 画面が狭くてもボタンが潰れないようにする */
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 24px;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Klee One', sans-serif;
            cursor: pointer;
            transition: background-color 0.2s ease;
            white-space: nowrap; /* テキストの折り返しを防止 */
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }
        
        .submit-btn:active {
            transform: scale(0.98);
        }

        /* ガイドテキストとメッセージ */
        .guide-text {
            font-size: 16px;
            color: #64748b;
            margin: 0 0 16px 0;
        }

        .result-message {
            font-size: 24px;
            font-weight: 600;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            margin-top: 10px;
        }

        /* モバイル向け微調整 */
        @media (max-width: 480px) {
            .puzzle-container {
                padding: 20px 15px;
            }
            .search-input {
                font-size: 16px;
                padding: 14px 16px;
            }
            .submit-btn {
                padding: 0 16px;
                font-size: 16px;
            }
            .result-message {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="puzzle-container">
        <!-- 画像 -->
        <img src="formpianazo.001.jpeg" alt="謎解き問題" class="puzzle-image">
        
        <!-- 検索風フォーム -->
        <form id="puzzleForm" class="search-form">
            <input type="text" id="puzzleInput" class="search-input" placeholder="アルファベットで入力" autocomplete="off" spellcheck="false">
            <button type="submit" class="submit-btn">送信</button>
        </form>
        
        <!-- 案内テキスト -->
        <p class="guide-text">分からない場合はヒントと入力してください</p>
        
        <!-- 結果表示エリア -->
        <div id="resultMessage" class="result-message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputEl = document.getElementById('puzzleInput');
            const formEl = document.getElementById('puzzleForm');
            const messageEl = document.getElementById('resultMessage');
            
            let messageTimeoutId = null;

            // ROT13変換関数 (アルファベットを13文字ずらす)
            function applyRot13(str) {
                return str.replace(/[a-zA-Z]/g, (char) => {
                    const baseCode = char <= 'Z' ? 65 : 97;
                    return String.fromCharCode((char.charCodeAt(0) - baseCode + 13) % 26 + baseCode);
                });
            }

            // 入力中の文字を監視してアルファベットだけをシフト
            inputEl.addEventListener('beforeinput', (e) => {
                // IME入力中(isComposing)ではない、かつアルファベットが含まれる場合
                if (e.data && /[a-zA-Z]/.test(e.data) && !e.isComposing) {
                    e.preventDefault(); 
                    
                    const shiftedText = applyRot13(e.data);
                    
                    // カーソル位置に変換後の文字を挿入
                    const startPos = inputEl.selectionStart;
                    const endPos = inputEl.selectionEnd;
                    inputEl.setRangeText(shiftedText, startPos, endPos, 'end');
                    
                    // カーソル位置を後ろに進める
                    inputEl.setSelectionRange(startPos + shiftedText.length, startPos + shiftedText.length);
                }
            });

            // メッセージを表示して2秒で消す関数
            function showMessage(text, colorHex) {
                if (messageTimeoutId) {
                    clearTimeout(messageTimeoutId);
                }

                messageEl.textContent = text;
                messageEl.style.color = colorHex;
                messageEl.style.opacity = '1';

                // 2000ms(2秒)後にフェードアウト
                messageTimeoutId = setTimeout(() => {
                    messageEl.style.opacity = '0';
                    // フェードアウト完了後にテキストをクリア
                    setTimeout(() => {
                        if(messageEl.style.opacity === '0') {
                            messageEl.textContent = '';
                        }
                    }, 300);
                }, 2000);
            }

            // フォーム送信時の判定ロジック
            formEl.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const inputValue = inputEl.value.trim();
                
                // 空送信は無視
                if (inputValue === '') return;

                // 1. アルファベット以外の文字（ひらがな、カタカナ、漢字、数字など）が含まれているか
                if (/[^a-zA-Z]/.test(inputValue)) {
                    showMessage('アルファベットで入力してください', 'var(--error-color)'); 
                    return;
                }

                // 2. 大文字小文字を区別せずに判定
                const upperValue = inputValue.toUpperCase();

                if (upperValue === 'BAR') {
                    showMessage('正解', 'var(--success-color)');
                } else if (upperValue === 'ONE') {
                    showMessage('惜しい', 'var(--warning-color)');
                } else if (upperValue === 'HINT' || upperValue === 'UVAG') {
                    // 入力内容がHINT、または13ずれてUVAGとなっている場合
                    showMessage('もう一度入力してください', 'var(--info-color)');
                } else {
                    showMessage('不正解', 'var(--danger-color)');
                }
            });
        });
    </script>
</body>
</html>
