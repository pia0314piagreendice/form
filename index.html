<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>13</title>
    
    <!-- クレーフォント (Klee One) の読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --primary-color: #5a80b4;
            --primary-hover: #456897;
            --bg-color: #f0f4f8;
            --text-color: #334155;
            --error-color: #d97706;
            --success-color: #16a34a;
            --warning-color: #ea580c;
            --info-color: #2563eb;
            --danger-color: #dc2626;
        }

        body {
            font-family: 'Klee One', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .puzzle-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .puzzle-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-bottom: 24px;
            object-fit: contain;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: block;
        }

        .search-form {
            display: flex;
            flex-wrap: nowrap;
            width: 100%;
            border: 2px solid #cbd5e1;
            border-radius: 30px;
            overflow: hidden;
            background-color: #fff;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 20px;
        }

        .search-form:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(90, 128, 180, 0.15);
        }

        .search-input {
            flex: 1; /* 入力欄を伸縮させる */
            min-width: 0; /* スマホで縮めるための必須指定 */
            border: none;
            padding: 16px 20px;
            font-size: 18px;
            font-family: 'Klee One', sans-serif;
            outline: none;
            background: transparent;
            color: var(--text-color);
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .submit-btn {
            flex-shrink: 0; /* 送信ボタンが潰れないように固定 */
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 24px;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Klee One', sans-serif;
            cursor: pointer;
            transition: background-color 0.2s ease;
            white-space: nowrap;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }
        
        .submit-btn:active {
            transform: scale(0.98);
        }

        .guide-text {
            font-size: 16px;
            color: #64748b;
            margin: 0 0 16px 0;
        }

        .result-message {
            font-size: 20px;
            font-weight: 600;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            margin-top: 10px;
            word-break: break-word;
        }

        @media (max-width: 480px) {
            .puzzle-container {
                padding: 20px 15px;
            }
            .search-input {
                font-size: 16px;
                padding: 14px 16px;
            }
            .submit-btn {
                padding: 0 16px;
                font-size: 16px;
            }
            .result-message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="puzzle-container">
        <!-- ご指定の画像 -->
        <img src="formpianazo.001.jpeg" alt="問題画像" class="puzzle-image" style="max-width: 100%; height: auto; margin-bottom: 20px;">
        
        <!-- 入力フォーム -->
        <form id="puzzleForm" class="search-form">
            <input type="text" id="puzzleInput" class="search-input" placeholder="アルファベットで入力" autocomplete="off" spellcheck="false">
            <button type="submit" class="submit-btn">送信</button>
        </form>
        
        <!-- 案内テキスト -->
        <p class="guide-text">分からない場合はヒントと入力してください</p>
        
        <!-- 結果表示エリア -->
        <div id="resultMessage" class="result-message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputEl = document.getElementById('puzzleInput');
            const formEl = document.getElementById('puzzleForm');
            const messageEl = document.getElementById('resultMessage');
            
            let messageTimeoutId = null;
            let isComposing = false;
            let previousValue = ""; // 前回の入力値を保存して差分を比較

            // ROT13変換関数（アルファベットのみ13文字ずらす）
            function applyRot13(str) {
                return str.replace(/[a-zA-Z]/g, (char) => {
                    const isUpper = char <= 'Z';
                    const baseCode = isUpper ? 65 : 97; // 'A' or 'a'
                    return String.fromCharCode((char.charCodeAt(0) - baseCode + 13) % 26 + baseCode);
                });
            }

            // IME入力開始（日本語変換など）
            inputEl.addEventListener('compositionstart', () => {
                isComposing = true;
            });

            // IME入力確定
            inputEl.addEventListener('compositionend', () => {
                isComposing = false;
                processInput();
            });

            // 通常の文字入力
            inputEl.addEventListener('input', () => {
                if (isComposing) return; // IME入力中は処理を保留
                processInput();
            });

            function processInput() {
                const newStr = inputEl.value;
                const oldStr = previousValue;
                
                if (newStr === oldStr) return;

                // 変更前と変更後の文字列を比較し、新しく追加された部分（差分）だけを抽出する
                let prefixLen = 0;
                while (prefixLen < oldStr.length && prefixLen < newStr.length && oldStr[prefixLen] === newStr[prefixLen]) {
                    prefixLen++;
                }

                let suffixLen = 0;
                while (suffixLen < oldStr.length - prefixLen && suffixLen < newStr.length - prefixLen && oldStr[oldStr.length - 1 - suffixLen] === newStr[newStr.length - 1 - suffixLen]) {
                    suffixLen++;
                }

                // 新たに挿入された文字列
                const insertedStr = newStr.substring(prefixLen, newStr.length - suffixLen);
                
                // アルファベットが含まれる場合のみシフト処理を適用
                if (insertedStr.length > 0 && /[a-zA-Z]/.test(insertedStr)) {
                    const shiftedInserted = applyRot13(insertedStr);
                    
                    // 前の文字列、シフトした文字列、後ろの文字列を結合
                    const finalStr = newStr.substring(0, prefixLen) + shiftedInserted + newStr.substring(newStr.length - suffixLen);
                    
                    // カーソル位置を保存
                    const selectionStart = inputEl.selectionStart;
                    const selectionEnd = inputEl.selectionEnd;
                    
                    inputEl.value = finalStr;
                    previousValue = finalStr;
                    
                    // カーソル位置を復元
                    try {
                        inputEl.setSelectionRange(selectionStart, selectionEnd);
                    } catch (e) {
                        // iOS Safariの特定条件下でのエラー回避
                    }
                } else {
                    // 削除操作のみ、またはアルファベット以外の入力の場合はそのまま更新
                    previousValue = newStr;
                }
            }

            function showMessage(text, colorHex) {
                if (messageTimeoutId) {
                    clearTimeout(messageTimeoutId);
                }

                messageEl.textContent = text;
                messageEl.style.color = colorHex;
                messageEl.style.opacity = '1';

                messageTimeoutId = setTimeout(() => {
                    messageEl.style.opacity = '0';
                    setTimeout(() => {
                        if(messageEl.style.opacity === '0') {
                            messageEl.textContent = '';
                        }
                    }, 300);
                }, 2000);
            }

            formEl.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const inputValue = inputEl.value.trim();
                if (inputValue === '') return;

                // 1. アルファベット以外の文字（ひらがな・カタカナ・漢字・数字・記号など）が含まれているか
                // 厳密には、半角英字以外が含まれているかチェック
                if (/[^a-zA-Z]/.test(inputValue)) {
                    showMessage('アルファベットで入力してください', 'var(--error-color)'); 
                    return;
                }

                // 2. 大文字小文字を区別せずに判定するための変換
                const upperValue = inputValue.toUpperCase();

                // 判定
                if (upperValue === 'BAR') {
                    // 元の入力「ONE」
                    showMessage('正解', 'var(--success-color)');
                } else if (upperValue === 'ONE') {
                    // 元の入力「BAR」
                    showMessage('惜しい', 'var(--warning-color)');
                } else if (upperValue === 'UVAG') {
                    // 元の入力「HINT」 (h->u, i->v, n->a, t->g)
                    showMessage('このサイトではアルファベットが13個ずれて表示されるようです', 'var(--info-color)');
                } else {
                    showMessage('不正解', 'var(--danger-color)');
                }
            });
        });
    </script>
</body>
</html>
