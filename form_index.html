<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>謎解きフォーム</title>
    <!-- Klee Oneフォントの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Klee One', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            box-sizing: border-box;
        }
        .puzzle-image {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin-bottom: 24px;
            border-radius: 8px;
        }
        .search-bar {
            display: flex;
            width: 100%;
            border: 2px solid #cbd5e1;
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 12px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: #fff;
        }
        .search-bar:focus-within {
            border-color: #7b9acc;
            box-shadow: 0 0 0 3px rgba(123, 154, 204, 0.2);
        }
        .search-bar input {
            flex-grow: 1;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            font-family: 'Klee One', sans-serif;
            outline: none;
            background: transparent;
        }
        .search-bar button {
            border: none;
            background-color: #7b9acc;
            color: white;
            padding: 0 28px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Klee One', sans-serif;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        .search-bar button:hover {
            background-color: #6382b5;
        }
        .hint-text {
            font-size: 15px;
            color: #64748b;
            margin: 0 0 24px 0;
        }
        .result-message {
            font-size: 22px;
            font-weight: 600;
            height: 33px; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 問題画像の表示 -->
        <img src="formpianazo.001.jpeg" alt="問題" class="puzzle-image">
        
        <!-- 入力フォーム -->
        <form id="puzzle-form">
            <div class="search-bar">
                <input type="text" id="puzzle-input" placeholder="アルファベットで入力" autocomplete="off" spellcheck="false">
                <button type="submit">送信</button>
            </div>
        </form>
        
        <!-- 修正されたヒントテキスト -->
        <p class="hint-text">分からない場合はヒントと入力してください</p>
        
        <!-- メッセージ表示エリア -->
        <div id="result-message" class="result-message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputElement = document.getElementById('puzzle-input');
            const formElement = document.getElementById('puzzle-form');
            const resultMessage = document.getElementById('result-message');
            
            let hideMessageTimeout = null;

            // アルファベット入力を13文字シフト（ROT13）する処理
            inputElement.addEventListener('beforeinput', (e) => {
                if (e.data && /[a-zA-Z]/.test(e.data) && !e.isComposing) {
                    e.preventDefault(); 
                    
                    const shiftedText = e.data.replace(/[a-zA-Z]/g, char => {
                        const baseCode = char <= 'Z' ? 65 : 97;
                        return String.fromCharCode((char.charCodeAt(0) - baseCode + 13) % 26 + baseCode);
                    });
                    
                    const start = inputElement.selectionStart;
                    const end = inputElement.selectionEnd;
                    inputElement.setRangeText(shiftedText, start, end, 'end');
                }
            });

            // フォーム送信時の判定処理
            formElement.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const inputValue = inputElement.value.trim();
                if (inputValue === '') return;

                if (hideMessageTimeout) {
                    clearTimeout(hideMessageTimeout);
                }

                // アルファベット以外の文字が含まれているか判定
                if (/[^a-zA-Z]/.test(inputValue)) {
                    showResult('アルファベットで入力してください', '#d97706'); 
                    return;
                }

                // 大文字・小文字を区別せず判定
                const upperValue = inputValue.toUpperCase();

                if (upperValue === 'BAR') {
                    showResult('正解', '#16a34a'); // 緑色
                } else if (upperValue === 'ONE') {
                    showResult('惜しい', '#ea580c'); // オレンジ色
                } else if (upperValue === 'HINT' || upperValue === 'UVAG') {
                    showResult('もう一度入力してください', '#2563eb'); // 青色
                } else {
                    showResult('不正解', '#dc2626'); // 赤色
                }
            });

            // メッセージを表示し、2秒後に消去する関数
            function showResult(text, color) {
                resultMessage.textContent = text;
                resultMessage.style.color = color;
                
                hideMessageTimeout = setTimeout(() => {
                    resultMessage.textContent = '';
                }, 2000);
            }
        });
    </script>
</body>
</html>
